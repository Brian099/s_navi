$: # 匹配所有分支
  push: # 触发事件：当代码被推送到仓库时
    - name: 打包并上传制品 (Push Triggered)
      docker:
        image: ubuntu:latest
      
      stages:
        # --- 阶段 1: 准备 Tag 和描述信息 ---
        - name: 准备 Tag 和描述
          jobs:
            # 任务 1.1: 生成版本号 (使用项目名称和日期)
            - name: Generate Tag Name
              script: |
                # 假设 CNB_REPO_NAME 包含仓库名，否则使用 'my_project' 作为默认值
                PROJECT_IDENTIFIER=${CNB_REPO_NAME:-my_project}
                # 最终 Tag 名称格式：release-项目名-YYYYMMDD
                echo "release-${PROJECT_IDENTIFIER}-$(date +%Y%m%d)"
              exports:
                info: TAG_NAME # 导出为环境变量 TAG_NAME

            # 任务 1.2: 生成 Release 描述 (优化：修正时区为 UTC+8)
            - name: Generate Release Description
              script: |
                # 使用 TZ='Asia/Shanghai' 确保时间为北京时间 (UTC+8)
                BUILD_TIME=$(TZ='Asia/Shanghai' date "+%Y-%m-%d %H:%M:%S")
                
                # 确保每一行单独输出，避免 -e 被打印
                echo "### 🚀 Auto-Build Release"
                echo "" # 确保Markdown格式中的空行
                echo "- **Branch**: ${CNB_BRANCH}"
                echo "- **Build Time**: ${BUILD_TIME}"
              exports:
                info: TAG_DESCRIPTION

        # --- 阶段 2: 打包仓库文件 (稳定工作流) ---
        - name: 打包仓库文件
          jobs:
            - name: Create Artifact
              script: |
                # 1. 定义变量
                RELEASE_NAME="${TAG_NAME}"
                TAR_FILENAME="release/${RELEASE_NAME}.tar.gz"
                
                # 2. 创建目录 
                mkdir -p release
                
                # 3. 打包
                tar --exclude='./.git' --exclude='./release' -czf $TAR_FILENAME .
                
                # 将信息性输出重定向到 stderr，不影响变量捕获
                echo "Release 制品已创建: $TAR_FILENAME" >&2
                
                # 4. 最终输出：将文件路径输出到 stdout 的最后一行
                echo "$TAR_FILENAME" 
              exports:
                info: CNB_RELEASE_FILE_PATH # 导出文件路径变量

        # --- 阶段 3: 创建 Release 并上传附件 ---
        - name: 发布 Release
          jobs:
            # 任务 3.1: 创建 Git Tag 和 Release
            - name: 创建 Release
              type: git:release 
              options:
                overlying: true
                tag: ${TAG_NAME}
                description: ${TAG_DESCRIPTION}
                
            # 任务 3.2: Release 上传附件
            - name: 上传 Release 制品
              image: cnbcool/attachments:latest
              settings:
                tag: ${TAG_NAME} 
                attachments:
                  - ${CNB_RELEASE_FILE_PATH}

        # --- 阶段 4: 清理（可选） ---
        - name: 清理
          script: rm -rf release